# Docker Compose для локальной сборки
# Используйте: docker-compose -f docker-compose.build.yml up --build -d

services:
  weeek-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: weeek-mcp-server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - WEEEK_BASE_URL=${WEEEK_BASE_URL:-https://api.weeek.net/public/v1}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - REQUEST_TIMEOUT=${REQUEST_TIMEOUT:-30}
      - RETRY_ATTEMPTS=${RETRY_ATTEMPTS:-3}
      - RETRY_DELAY=${RETRY_DELAY:-1.0}
      - TRANSPORT=${TRANSPORT:-sse}
      - SERVER_HOST=${SERVER_HOST:-0.0.0.0}
      - SERVER_PORT=${SERVER_PORT:-3847}
      - MCP_API_KEY=${MCP_API_KEY}
    ports:
      - "${SERVER_PORT:-3847}:3847"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3847/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

